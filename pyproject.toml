[project]
name = "echelon"
dynamic = ["version"]
description = "Echelon is a monitoring daemon that watches specific line ranges in GitHub code and alerts you when they change."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "AegisTrail" }]
keywords = ["github", "monitoring", "security", "auditing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Security",
  "Topic :: Software Development :: Version Control",
]
dependencies = [
  "requests>=2.32.5",
]
urls = { Homepage = "https://github.com/AegisTrail/Echelon", Repository = "https://github.com/AegisTrail/Echelon" }

[project.scripts]
echelon = "echelon:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "BLE001", "E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "_version.py"

[tool.hatch.build.targets.wheel]
include = ["*.py", "config.example.json", ".env.example", "README.md", "SECURITY.md", "CHANGELOG.md"]
exclude = ["tests"]
